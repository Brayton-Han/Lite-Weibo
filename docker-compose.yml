# 所有密钥从根目录 .env 读取（cp .env.example .env 后填写），不写进本文件。
# 标了 :? 的变量是必填项，缺失时 docker compose 直接报错，不会用空值启动。
#
# 端口：数据库 / Redis / RabbitMQ 只绑 127.0.0.1，供本机 ./mvnw spring-boot:run 和调试工具使用，
# 外网不可达。容器之间走 compose 内网，不依赖这些映射。
#
# 编排：数据层都有 healthcheck，backend 等三者 healthy 后才启动；所有服务 restart: unless-stopped；
# 每个服务设内存上限（deploy.resources.limits，docker compose v2 非 swarm 模式也生效），
# 合计约 3.5G，按主机规格调整。

x-restart: &restart
  restart: unless-stopped

# 镜像 tag 固定到具体版本，避免 pull 时静默升级；升级时显式改这里
services:
  postgresql:
    image: pgvector/pgvector:0.8.6-pg15
    container_name: postgresql_weibo
    environment:
      POSTGRES_DB: weibo
      POSTGRES_USER: postgres
      # 只在数据卷首次初始化时生效；已有 pgdata 卷时需要手动 ALTER USER 改密码
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    <<: *restart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d weibo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7.4.12
    container_name: redis_weibo
    # feed 索引只存在于 Redis，读路径不回源数据库，
    # 因此必须开启 AOF 持久化并挂卷，否则容器重建后 feed 全部变空。
    command: redis-server --appendonly yes --appendfsync everysec --requirepass ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
    environment:
      # 仅供下面的 healthcheck 里 redis-cli 认证使用（redis-cli 会自动读取 REDISCLI_AUTH）
      REDISCLI_AUTH: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    <<: *restart
    healthcheck:
      # 未认证时 redis-cli 也返回 0，所以要匹配 PONG
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          # feed 索引常驻 Redis 且不能被淘汰（默认 noeviction），数据量上来后要调大这个值
          memory: 512m

  rabbitmq:
    image: rabbitmq:3.13.7-management
    container_name: rabbitmq_weibo
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?请在 .env 中设置 RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请在 .env 中设置 RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      # 管理界面；远程服务器上通过 ssh -L 15672:localhost:15672 访问
      - "127.0.0.1:15672:15672"
    <<: *restart
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          # RabbitMQ 会识别 cgroup 内存上限，按默认 0.4 水位线触发流控
          memory: 512m

  backend:
    build: ./backend
    container_name: backend
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    <<: *restart
    deploy:
      resources:
        limits:
          memory: 1g
    ports:
      - "8080:8080"
      # Actuator（/actuator/metrics、/actuator/prometheus），只绑本机回环，不对外
      - "127.0.0.1:8081:8081"
    # 环境变量优先级高于打进 jar 的 application.yml，容器内一律以这里为准
    environment:
      # 结构化 JSON 日志（Spring Boot 内置 logstash 格式），MDC 里的 traceId / userId 是独立字段
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
      # 生产不打 SQL：拖慢请求，且会把参数写进日志
      SPRING_JPA_SHOW_SQL: "false"
      # 当日 Claude 花费阈值（美元），到了就关闭 AI 回答、只保留检索
      AI_BUDGET_DAILY_USD: ${AI_BUDGET_DAILY_USD:-5.0}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql_weibo:5432/weibo
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis_weibo
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq_weibo
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?请在 .env 中设置 RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?请在 .env 中设置 RABBITMQ_PASSWORD}
      # 至少 32 字节随机串：openssl rand -base64 48。JWTService 会拒绝过短或已公开的值
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      # 图片存储 Cloudflare R2（对应 application.yml 的 r2.*）
      R2_ACCOUNTID: ${R2_ACCOUNT_ID:?请在 .env 中设置 R2_ACCOUNT_ID}
      R2_ACCESSKEY: ${R2_ACCESS_KEY:?请在 .env 中设置 R2_ACCESS_KEY}
      R2_SECRETKEY: ${R2_SECRET_KEY:?请在 .env 中设置 R2_SECRET_KEY}
      R2_BUCKET: ${R2_BUCKET:-weibo-images}
      R2_PUBLICBASEURL: ${R2_PUBLIC_BASE_URL:?请在 .env 中设置 R2_PUBLIC_BASE_URL}
      # 新帖增量向量化用。未设置时发帖照常，只是不生成向量
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      # 站内问答生成层用。未设置时应用照常启动，只是问答调用会失败
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  frontend:
    build:
      context: ./frontend
      # 浏览器访问的后端地址，构建时内联进前端包（运行时 environment 对 NEXT_PUBLIC_* 不起作用）
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    <<: *restart
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  pgdata:
  redisdata:
