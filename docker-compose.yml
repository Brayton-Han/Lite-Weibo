services:
  postgresql:
    image: pgvector/pgvector:pg15
    container_name: postgresql_weibo
    environment:
      POSTGRES_DB: weibo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis_weibo
    # feed 索引只存在于 Redis，读路径不回源数据库，
    # 因此必须开启 AOF 持久化并挂卷，否则容器重建后 feed 全部变空。
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_weibo
    ports:
      - "5672:5672"
      - "15672:15672"

  backend:
    build: ./backend
    container_name: backend
    depends_on:
      - postgresql
      - redis
      - rabbitmq
    ports:
      - "8080:8080"
      # Actuator（/actuator/metrics、/actuator/prometheus），只绑本机回环，不对外
      - "127.0.0.1:8081:8081"
    environment:
      # 结构化 JSON 日志（Spring Boot 内置 logstash 格式），MDC 里的 traceId / userId 是独立字段
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
      # 当日 Claude 花费阈值（美元），到了就关闭 AI 回答、只保留检索
      AI_BUDGET_DAILY_USD: ${AI_BUDGET_DAILY_USD:-5.0}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql_weibo:5432/weibo
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DATA_REDIS_HOST: redis_weibo
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq_weibo
      SPRING_RABBITMQ_PORT: 5672
      # 新帖增量向量化用；从宿主机环境透传，不写进文件。未设置时发帖照常，只是不生成向量
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      # 站内问答生成层用；同样从宿主机透传。未设置时应用照常启动，只是问答调用会失败
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  frontend:
    build:
      context: ./frontend
      # 浏览器访问的后端地址，构建时内联进前端包（运行时 environment 对 NEXT_PUBLIC_* 不起作用）
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata: