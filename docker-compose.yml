services:
  postgresql:
    image: postgres:15
    container_name: postgresql_weibo
    environment:
      POSTGRES_DB: weibo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis_weibo
    # feed 索引只存在于 Redis，读路径不回源数据库，
    # 因此必须开启 AOF 持久化并挂卷，否则容器重建后 feed 全部变空。
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_weibo
    ports:
      - "5672:5672"
      - "15672:15672"

  backend:
    build: ./backend
    container_name: backend
    depends_on:
      - postgresql
      - redis
      - rabbitmq
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql_weibo:5432/weibo
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DATA_REDIS_HOST: redis_weibo
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq_weibo
      SPRING_RABBITMQ_PORT: 5672

  frontend:
    build: ./frontend
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080

volumes:
  pgdata:
  redisdata: