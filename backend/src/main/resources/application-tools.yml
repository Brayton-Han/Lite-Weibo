# tools profile：一次性离线工具（语料导入等）。
#
# ⚠️ 这里曾经设过 spring.main.web-application-type: none 让应用跑完自然退出，
#    但本项目起不来——Spring Security 的 WebSecurityConfiguration 依赖
#    CorsConfigurationSource，而该 Bean 只在 Web 上下文中存在。
#    改由 ToolsShutdownRunner 在所有 CommandLineRunner 执行完毕后关闭上下文。
spring:
  jpa:
    show-sql: false        # 导入 3000 条时 SQL 日志会淹没工具自己的输出
  # 不消费 MQ：工具与 backend 容器同时运行时，NotificationService 的 @RabbitListener 会抢队列消息，
  # 通知照常落库，但 WebSocket 推送从这个没有任何客户端连接的进程发出，实时推送就丢了
  rabbitmq:
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false

# RAG Day 17：评测要测的是模型本身，线上那套保护全部关掉——
# 降级会让指标静默混进检索结果；缓存会让重跑拿到旧回答；限流和熔断会把评测打断，
# 而且评测的花费不该算进线上的当日预算（两边共用一个 Redis）
claude:
  max-retries: 2
# 与线上 backend 同时跑时不抢 8081
management:
  server:
    port: -1
ask:
  degrade:
    enabled: false
  cache:
    enabled: false
ratelimit:
  enabled: false
ai:
  budget:
    enabled: false
