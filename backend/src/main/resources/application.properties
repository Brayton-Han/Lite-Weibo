spring.application.name=platform

# ── RAG Day 17：成本、限流、降级、可观测（均可在 application.yml 或环境变量里覆盖）──

# 可观测：Actuator 走单独的管理端口，docker-compose 不映射到宿主机，只在内网可达
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=lite-weibo
# 延迟类指标出 p50 / p95 / p99（Prometheus 侧用 histogram_quantile 也行）
management.metrics.distribution.percentiles.claude.calls=0.5,0.95,0.99
management.metrics.distribution.percentiles.search.retrieval.latency=0.5,0.95,0.99
management.metrics.distribution.percentiles.rerank.latency=0.5,0.95,0.99
management.metrics.distribution.percentiles.ask.latency=0.5,0.95,0.99
# 每行日志带上 traceId / userId（TraceIdFilter 放进 MDC）；结构化 JSON 日志见 docker-compose 的 LOGGING_STRUCTURED_FORMAT_CONSOLE
logging.pattern.level=%5p [%X{traceId:-},%X{userId:-}]

# 超时：线上只重试 1 次，墙钟上限 = 单次超时 × 2（评测 tools profile 改回 2 次）
claude.max-retries=1
claude.intent.timeout-ms=8000
claude.generation.timeout-ms=30000

# 限流（令牌桶，按 userId）
ratelimit.ask.capacity=20
ratelimit.ask.period=1h
ratelimit.search.capacity=60
ratelimit.search.period=1m
# 登录 / 注册（匿名，按 IP 与用户名，见 AuthRateLimitPolicies）
ratelimit.login-ip.capacity=30
ratelimit.login-ip.period=10m
ratelimit.login-user.capacity=10
ratelimit.login-user.period=10m
ratelimit.register-ip.capacity=10
ratelimit.register-ip.period=1h
# 图片上传（按 userId）
ratelimit.upload.capacity=30
ratelimit.upload.period=10m

# 反向代理（Caddy）后取真实客户端 IP：Tomcat RemoteIpValve 只在直连方是内网地址时才采信 X-Forwarded-For，
# 公网客户端伪造的头不生效。登录 / 注册按 IP 限流依赖这一项
server.forward-headers-strategy=native

# 成本熔断：当日（UTC）Claude 花费到阈值后关闭 AI 回答，只保留检索
ai.budget.daily-usd=${AI_BUDGET_DAILY_USD:5.0}

# 热门 query 缓存
ask.cache.ttl=30m

# rerank 接入线上语义搜索（Day 12 选定：候选 30）
retrieval.rerank.n=30

# ── 非密钥的基础配置 ──
# 放这里（入库）而不是 application.yml：application.yml 含本地密钥，打 jar 时被排除（见 pom.xml maven-jar-plugin），
# 容器内只有本文件 + 环境变量。同一目录下 .properties 优先级高于 .yml。
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jackson.serialization.fail-on-empty-beans=false
spring.data.redis.timeout=3000
# 单张 10MB（FileService.MAX_FILE_BYTES 业务层再校验一次）；整个请求 20MB，超出回 413
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
